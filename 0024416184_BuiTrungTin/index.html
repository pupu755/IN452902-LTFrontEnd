<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <title>EduHub Web - Sự kiện</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">EduHub Web</a>
    <nav>

      <a href="index.html">Sự kiện</a>
      <a href="#">Đăng ký</a>
    </nav>
  </header>

  <main>
    <h1>Sự kiện sắp diễn ra</h1>

    <form id="search-form">

        <p><time datetime="2026-09-12T08:00">08:00, 12/09/2026</time></p>
        <p>Phòng máy A3.201</p>
        <p class="seats">Còn 12/40 chỗ</p>
      </article>

      <article class="card">
        <img src="img/event.svg" alt="Ảnh minh hoạ Hackathon EduHub 24 giờ">
        <h2><a href="event-detail.html?id=2">Hackathon EduHub 24 giờ</a></h2>
        <p><time datetime="2026-12-19T08:00">08:00, 19/12/2026</time></p>
        <p>Phòng máy A3.205</p>
        <p class="seats"><span class="badge-full">Hết chỗ</span></p>

    </div>

  <footer>
    <p>&copy; 2026 EduHub Web</p>
  </footer>
